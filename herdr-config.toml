# Fragmento para ~/.config/herdr/config.toml
# (en Windows: %APPDATA%\herdr\config.toml)
#
# Mantiene todos los atajos de prefijo por defecto y añade chords directos
# ctrl+alt que coinciden uno a uno con la capa META del Voyager.
#
# Los nombres de las acciones están tomados de la referencia de configuración
# de Herdr 0.8.2. Tras editar: herdr server reload-config

[keys]
prefix = "ctrl+b"

# Foco de panel — mano derecha del teclado, sobre las teclas h j k l reales
focus_pane_left  = ["prefix+h", "ctrl+alt+h"]
focus_pane_down  = ["prefix+j", "ctrl+alt+j"]
focus_pane_up    = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

# Paneles
zoom             = ["prefix+z", "ctrl+alt+z"]
split_vertical   = ["prefix+v", "ctrl+alt+d"]
split_horizontal = ["prefix+minus", "ctrl+alt+shift+d"]
close_pane       = ["prefix+x", "ctrl+alt+x"]

# Pestañas
new_tab          = ["prefix+c", "ctrl+alt+c"]
next_tab         = ["prefix+n", "ctrl+alt+n"]
previous_tab     = ["prefix+p", "ctrl+alt+p"]

# Sesión
workspace_picker = ["prefix+w", "ctrl+alt+w"]
goto             = ["prefix+g", "ctrl+alt+g"]
detach           = ["prefix+q", "ctrl+alt+q"]

# Nota sobre ctrl+alt+l: la documentación de Herdr lo marca como bloqueo de
# pantalla en KDE. En GNOME, Windows y macOS está libre. Si algún día usas KDE,
# cambia focus_pane_right a "ctrl+alt+o" aquí y en keymap.c (HRD_RIGHT).
#
# Tampoco se usa ninguna combinación ctrl+alt+flecha (GNOME las usa para
# cambiar de espacio de trabajo) ni ctrl+alt+t (abrir terminal en Ubuntu).
